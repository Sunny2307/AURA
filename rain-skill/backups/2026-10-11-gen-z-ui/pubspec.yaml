name: aura
description: "Aura — your reputation, gamified."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  cloud_firestore: ^6.9.0
  firebase_auth: ^6.6.1
  firebase_core: ^4.14.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.31.1

flutter:
  uses-material-design: true

  fonts:
    # Nunito ships as a single variable font covering weights 200-1000.
    # Bundled rather than fetched at runtime so the brand face is present on
    # first launch and offline. Weights are selected in code via
    # `fontVariations: [FontVariation('wght', n)]` — see core/theme/aura_typography.dart.
    # Licence: OFL 1.1, see assets/fonts/OFL.txt.
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito[wght].ttf
