# Gradle settings for the Android build.
#
# Every line below the AndroidX flag is a deliberate change from the Flutter
# template — see the comments. Do not "tidy" them away.

# The template ships -Xmx8G -XX:MaxMetaspaceSize=4G. On a 16 GB machine that is
# up to 12 GB for Gradle alone, before the Kotlin compiler daemon, Windows, and
# an IDE. That over-commit made the Kotlin compiler fail to memory-map its
# incremental cache files ("Could not close incremental caches ... at
# ResizeableMappedFile.<init>"), which failed the whole build.
# Aura is a small module set; 4 GB is ample and leaves room for the daemons.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=320m -XX:+HeapDumpOnOutOfMemoryError

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental compilation off, on purpose.
#
# The only Kotlin in this project is MainActivity plus the generated Flutter
# plugin glue — it changes on a plugin version bump and essentially never
# otherwise. So incremental compilation saves close to nothing here, while its
# memory-mapped .tab cache files under build/*/kotlin/ are what actually broke
# the build above. Turning it off removes a whole class of Windows file-locking
# and mmap failures for no measurable build-time cost.
#
# Revisit only if real Kotlin source is added to the Android side.
kotlin.incremental=false

# Run the Kotlin compiler inside the Gradle daemon instead of spawning a second
# JVM. One fewer process competing for the same 16 GB, and it means the heap
# limit set above is the actual ceiling rather than one of two independent ones.
kotlin.compiler.execution.strategy=in-process
